name: dsh-release-gate
# Requires a maintained Windows runner with the tested official DSH runtime.
# No release publication is automated; this successful gate is required evidence.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-mcp-dsh:
    runs-on: [self-hosted, Windows, dsh-release]
    env:
      MRL_DSH_EXECUTABLE: ${{ vars.MRL_DSH_EXECUTABLE }}
      MRL_DSH_NODE_MODULES: ${{ vars.MRL_DSH_NODE_MODULES }}
      MRL_DSH_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,mcp]"
      # Missing runtime/config is a failure, never a silently skipped release gate.
      - run: python scripts/release_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dsh-release-evidence
          path: |
            dist/_run/release-*/result.json
            dist/_run/release-*/pytest/test_actual_dsh_agent_factory_*/host-acceptance/acceptance.json
