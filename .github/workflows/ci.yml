name: core-mcp
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,mcp]"
      - run: ruff check src tests scripts benchmarks
      - run: ruff format --check src tests scripts benchmarks
      - run: python -m mypy
      # Hosted CI is Core/MCP + DSH packaging only, not actual Host acceptance.
      - run: python -m pytest -m "not codex_compat"
      - run: python -m build
  codex-compatibility:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,mcp]"
      - run: python -m pytest -m codex_compat
