[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "math-research-ledger"
dynamic = ["version"]
description = "Persistent research memory, context, dependency tracking and verification for mathematics."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Caie777" }]
keywords = ["mathematics", "research", "ledger", "mcp"]
dependencies = ["typer>=0.12", "pydantic>=2.0", "pyyaml>=6.0", "pypdf>=4.0"]

[project.urls]
Repository = "https://github.com/Caie777/math-research-ledger"
Issues = "https://github.com/Caie777/math-research-ledger/issues"

[project.optional-dependencies]
mcp = ["mcp>=1.30,<2"]
# Bundle/package tests invoke build --no-isolation, so the backend must also be
# installed in the development environment, not only pip's isolated build env.
dev = ["pytest>=8.0", "ruff==0.15.17", "mypy~=2.1", "types-PyYAML", "build>=1.0", "setuptools>=77.0.3", "wheel"]

[project.scripts]
math-research-ledger = "math_research.cli.main:run"
math-research-ledger-mcp = "math_research.mcp.server:main"
smr = "math_research.cli.main:run"
math-research = "math_research.cli.main:run"
smr-mcp = "math_research.mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
"math_research.core" = ["research_agents.md"]

[tool.setuptools.dynamic]
version = { attr = "math_research.__version__" }

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.11"
files = ["src/math_research"]
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: needs an explicitly enabled external service",
    "codex_compat: Codex-only packaging compatibility; not a Core/MCP/DSH release gate",
]
