# Mathematical Research workspace configuration. Edit locally; secrets are never committed.
model:
  # Provider: mock | openai | anthropic | ollama | mistral
  provider: mock
  name: mock-default
  reasoning_effort: null
  temperature: 0.2
  base_url: null
  timeout_seconds: 300
  max_retries: 5
  num_ctx: null
  top_p: null
  top_k: null
  seed: null
  num_predict: null
  max_tokens: null
  keep_alive: null
  verify_tool_calling: true
models:
  default_profile: null
  # profiles: a mapping of profile name to model settings
  profiles: {}
project:
  mode: research
agent:
  style: normal
  mode: normal
  max_steps: 12
  max_wall_seconds: null
permissions:
  mode: ask
privacy:
  sensitive_file_guard: true
  allow_sensitive_context: false
ui:
  render_math: true
  notifications_enabled: true
  notify_on_turn_complete: true
  notify_on_permission: true
  notify_only_unfocused: true
  notify_min_elapsed_seconds: 3
context:
  retrieval_enabled: true
  top_k: 5
  stable_prefix: true
  history_turns: 50
  token_budget: 24000
  compaction_enabled: true
  compaction_threshold: 0.85
  compaction_llm: true
  compaction_keep_ratio: 0.5
  embeddings_enabled: true
  embeddings_backend: auto
  embeddings_provider: null
  embeddings_model: null
tools:
  literature:
    enabled: true
    openalex: true
    arxiv: true
    contact_email: null
    proxy_base_url: null
    rate_limit_per_minute: 20
    daily_request_budget: 500
  web:
    enabled: true
    fetch: true
    search: true
    max_chars: 8000
governance:
  dlp: true
  dlp_pii: redact
  budgets:
    cost_budget_usd: null
    token_budget: null
    per_provider_usd: {}
  routing:
    enabled: false
    task_models: {}
    task_routes: {}
